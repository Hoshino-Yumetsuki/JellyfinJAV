<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>JellyfinJav Config</title>
</head>

<body>
    <div id="JellyfinJavConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
        data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="JellyfinJavConfigForm">
                    <div class="selectContainer">
                        <label class="selectLabel" for="actressNameOrder">Actress Name Order</label>
                        <select is="emby-select" id="actressNameOrder" name="actressNameOrder"
                            class="emby-select-withcolor emby-select">
                            <option id="FirstLast" value="FirstLast">First Name - Last Name</option>
                            <option id="LastFirst" value="LastFirst">Last Name - First Name</option>
                        </select>
                    </div>
                    <div class="selectContainer">
                        <label class="selectLabel" for="videoDisplayName">Video Display Name</label>
                        <select is="emby-select" id="videoDisplayName" name="videoDisplayName"
                            class="emby-select-withcolor emby-select">
                            <option id="CodeTitle" value="CodeTitle">Code Title</option>
                            <option id="Title" value="Title">Title</option>
                        </select>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescripton">
                        <label class="emby-checkbox-label">
                            <input id="enableActresses" name="TrueFalseCheckBox" type="checkbox" is="emby-checkbox" />
                            <span>Enable Actresses</span>
                        </label>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var pluginUniqueId = '1d5fffc2-1028-4553-9660-bd4966899e44';

            document.getElementById('JellyfinJavConfigPage').addEventListener('pageshow', () => {
                ApiClient.getPluginConfiguration(pluginUniqueId).then(config => {
                    document.getElementById('actressNameOrder').value = config.ActressNameOrder;
                    document.getElementById('videoDisplayName').value = config.VideoDisplayName;
                    document.getElementById('enableActresses').checked = config.EnableActresses;
                });
            });

            document.getElementById('JellyfinJavConfigForm').addEventListener('submit', function (event) {
                event.preventDefault();
                ApiClient.getPluginConfiguration(pluginUniqueId).then(config => {
                    config.ActressNameOrder = document.getElementById('actressNameOrder').value;
                    config.VideoDisplayName = document.getElementById('videoDisplayName').value;
                    config.EnableActresses = document.getElementById('enableActresses').checked;

                    ApiClient.updatePluginConfiguration(pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });
            });
        </script>
    </div>
</body>

</html>
